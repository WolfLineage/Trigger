<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Trigger - 内核配置管理</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="header">
        <h1>⚒️Trigger</h1>
        <button class="theme-toggle" onclick="toggleTheme()">☀️️</button>
    </div>
    <div class="topnav">
        <div class="nav-indicator"></div>
        <a href="#" class="nav-item active" onclick="switchPage('config', this)">自启配置</a>
        <a href="#" class="nav-item" onclick="switchPage('bootconfig', this)">开机配置</a>
        <a href="#" class="nav-item" onclick="switchPage('changebox', this)">改机型</a>
        <a href="#" class="nav-item" onclick="switchPage('about', this)">关于</a>
    </div>

    <!-- 自启配置页面 -->
    <div id="config-page" class="page-content active">
        <div class="main card">
            <h2>-自启配置编辑-</h2>
            <textarea placeholder="输入自启配置内容...
格式：包名=脚本路径=输入内容"></textarea>
            <div style=" display: flex; justify-content: space-between; width: 95%;">
                <button class="plugin-buttons">加载</button>
                <button class="plugin-buttons">保存</button>
            </div>
        </div>
        <div class="footer">
            <div id="core-card" class="info card info-full">自启核心加载中...</div>
            <div id="battery-card" class="info card">电池信息</div>
            <div id="brand-card" class="info card">设备品牌</div>
            <div id="fingerprint-card" class="info card">设备指纹</div>
            <div id="sn-card" class="info card">序列号</div>
        </div>
    </div>

    <!-- 开机配置页面 -->
    <div id="bootconfig-page" class="page-content">
        <div class="main card">
            <h2>-开机配置编辑-</h2>
            <textarea placeholder="输入开机配置内容...
格式：脚本路径=输入内容"></textarea>
            <div style=" display: flex; justify-content: space-between; width: 95%;">
                <button class="plugin-buttons">加载</button>
                <button class="plugin-buttons">保存</button>
            </div>
        </div>
    </div>

    <!-- 改机型页面 -->
    <div id="changebox-page" class="page-content">
        <div class="device-info-section">
            <div class="device-info card">
                <div class="device-info-row">
                    <div class="device-info-item" id="current-model-item">
                        <div class="info-label">当前机型</div>
                        <div id="current-model" class="info-value">加载中...</div>
                    </div>
                    <div class="device-info-item restore-button" id="original-model-item" onclick="window.restoreDevice?.()">
                        <div class="info-label">原始机型（点击还原）</div>
                        <div id="original-model" class="info-value">加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main card module-list-container">
            <h2>-选择机型模块-</h2>
            <div id="module-list" class="module-list">
                <div class="loading-tip">扫描中...</div>
            </div>
        </div>
    </div>

    <!-- 关于页面 -->
    <div id="about-page" class="page-content">
        <div class="main card">
            <h2>-关于Trigger-</h2>
            <div style="padding: 20px; text-align: center;">
                <p style="margin-bottom: 10px;">Trigger - 内核配置管理工具</p>
                <p style="font-size: 14px; line-height: 1.8;">
                    多功能模块，管理系统属性配置和机型设置。<br/>
                    支持自定义机型模块加载，ColorOS效果最佳。<br/>
                    QQ群:690837385  作者:Vorthas
                </p>
                <img src="Reward.jpg" style="width: 300px">
                <p style="font-size: 10px; color: rgba(128, 197, 131, 0.7);">本项目完全开源，二改请声明来源，商用请向作者提出申请，违者追究法律责任，使用则默认同意。</p>
            </div>
        </div>
    </div>

    <script src="Script.js"></script>
    <script type="module" src="Module.js"></script>
</body>
</html>
